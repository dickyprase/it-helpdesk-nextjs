<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none" font-family="system-ui,sans-serif">
  <rect width="800" height="560" fill="#fff" stroke="#ddd"/>
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Wireframe: Halaman Register</text>
  <!-- Background -->
  <rect x="200" y="55" width="400" height="470" rx="16" fill="#f5f5f5" stroke="#ddd"/>
  <!-- Card -->
  <rect x="230" y="80" width="340" height="420" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="230" y="80" width="340" height="44" rx="12" fill="#f5f5f5" stroke="#ddd"/>
  <text x="400" y="107" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Buat Akun</text>
  <!-- Name field -->
  <text x="252" y="148" font-size="10" fill="#777">Nama Lengkap</text>
  <rect x="248" y="154" width="304" height="32" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="260" y="175" font-size="10" fill="#999">John Doe</text>
  <!-- Email field -->
  <text x="252" y="206" font-size="10" fill="#777">Email</text>
  <rect x="248" y="212" width="304" height="32" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="260" y="233" font-size="10" fill="#999">nama@email.com</text>
  <!-- Phone field -->
  <text x="252" y="264" font-size="10" fill="#777">No. WhatsApp (opsional)</text>
  <rect x="248" y="270" width="304" height="32" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="260" y="291" font-size="10" fill="#999">08123456789</text>
  <!-- Password field -->
  <text x="252" y="322" font-size="10" fill="#777">Password</text>
  <rect x="248" y="328" width="304" height="32" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="260" y="349" font-size="10" fill="#999">Minimal 6 karakter</text>
  <!-- Confirm Password -->
  <text x="252" y="380" font-size="10" fill="#777">Konfirmasi Password</text>
  <rect x="248" y="386" width="304" height="32" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="260" y="407" font-size="10" fill="#999">Ulangi password</text>
  <!-- Button -->
  <rect x="320" y="434" width="160" height="36" rx="8" fill="#333"/>
  <text x="400" y="457" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Daftar</text>
  <!-- Login link -->
  <text x="400" y="490" text-anchor="middle" font-size="10" fill="#999">Sudah punya akun? <tspan fill="#333" font-weight="600">Masuk di sini</tspan></text>
  <!-- Annotations -->
  <line x1="560" y1="175" x2="620" y2="175" stroke="#bbb" stroke-dasharray="4"/>
  <text x="625" y="172" font-size="9" fill="#999">Validasi: min 2 karakter</text>
  <line x1="560" y1="291" x2="620" y2="291" stroke="#bbb" stroke-dasharray="4"/>
  <text x="625" y="288" font-size="9" fill="#999">Untuk notifikasi WA</text>
  <line x1="560" y1="457" x2="620" y2="457" stroke="#bbb" stroke-dasharray="4"/>
  <text x="625" y="454" font-size="9" fill="#999">POST → registerAction</text>
  <text x="625" y="466" font-size="9" fill="#999">Role otomatis: USER</text>
</svg>

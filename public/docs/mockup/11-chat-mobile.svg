<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none" font-family="system-ui,sans-serif">
  <rect width="800" height="560" fill="#fff" stroke="#ddd"/>
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Wireframe: Floating Chat (Desktop + Mobile)</text>

  <!-- LEFT: Desktop View -->
  <text x="210" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#777">Desktop View</text>
  <!-- Page background -->
  <rect x="30" y="75" width="360" height="460" rx="10" fill="#f5f5f5" stroke="#ddd"/>
  <!-- Page content (blurred) -->
  <rect x="46" y="91" width="328" height="30" rx="6" fill="#eee"/>
  <rect x="46" y="131" width="328" height="80" rx="6" fill="#eee"/>
  <rect x="46" y="221" width="200" height="16" rx="4" fill="#eee"/>
  <rect x="46" y="247" width="280" height="16" rx="4" fill="#eee"/>

  <!-- Floating chat panel -->
  <rect x="140" y="180" width="240" height="300" rx="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <!-- Chat header -->
  <rect x="140" y="180" width="240" height="36" rx="12" fill="#333"/>
  <text x="160" y="203" font-size="10" font-weight="600" fill="#fff">💬 Live Chat</text>
  <rect x="340" y="188" width="28" height="20" rx="4" fill="#555"/>
  <text x="354" y="202" text-anchor="middle" font-size="10" fill="#fff">✕</text>
  <!-- Messages -->
  <rect x="156" y="228" width="130" height="32" rx="8" fill="#eee"/>
  <text x="166" y="240" font-size="8" font-weight="600" fill="#333">User 1</text>
  <text x="166" y="252" font-size="8" fill="#777">Printer error E-05</text>
  <rect x="226" y="270" width="140" height="32" rx="8" fill="#333"/>
  <text x="236" y="282" font-size="8" font-weight="600" fill="#fff">Staff 1</text>
  <text x="236" y="294" font-size="8" fill="#ddd">Saya cek sekarang</text>
  <rect x="156" y="312" width="120" height="32" rx="8" fill="#eee"/>
  <text x="166" y="324" font-size="8" font-weight="600" fill="#333">User 1</text>
  <text x="166" y="336" font-size="8" fill="#777">Terima kasih</text>
  <!-- Input bar -->
  <rect x="156" y="440" width="160" height="26" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="166" y="457" font-size="9" fill="#999">Ketik pesan...</text>
  <rect x="324" y="440" width="40" height="26" rx="6" fill="#333"/>
  <text x="344" y="457" text-anchor="middle" font-size="10" fill="#fff">▶</text>

  <!-- Floating bubble -->
  <circle cx="360" cy="510" r="22" fill="#333"/>
  <text x="360" y="514" text-anchor="middle" font-size="12" fill="#fff">💬</text>
  <text x="360" y="548" text-anchor="middle" font-size="8" fill="#999">Bubble button</text>

  <!-- RIGHT: Mobile View -->
  <text x="590" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#777">Mobile View (Fullscreen)</text>
  <!-- Phone frame -->
  <rect x="480" y="75" width="220" height="460" rx="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Status bar -->
  <rect x="480" y="75" width="220" height="24" rx="20" fill="#333"/>
  <text x="590" y="91" text-anchor="middle" font-size="8" fill="#fff">9:41</text>
  <!-- Chat header -->
  <rect x="480" y="99" width="220" height="36" fill="#333"/>
  <text x="500" y="121" font-size="10" font-weight="600" fill="#fff">💬 Live Chat</text>
  <text x="680" y="121" font-size="10" fill="#fff">✕</text>
  <!-- Messages fullscreen -->
  <rect x="496" y="148" width="130" height="30" rx="8" fill="#eee"/>
  <text x="506" y="160" font-size="7" font-weight="600" fill="#333">User 1</text>
  <text x="506" y="170" font-size="7" fill="#777">Printer error E-05</text>
  <rect x="556" y="186" width="130" height="30" rx="8" fill="#333"/>
  <text x="566" y="198" font-size="7" font-weight="600" fill="#fff">Staff 1</text>
  <text x="566" y="208" font-size="7" fill="#ddd">Saya cek sekarang</text>
  <rect x="496" y="224" width="110" height="30" rx="8" fill="#eee"/>
  <text x="506" y="236" font-size="7" font-weight="600" fill="#333">User 1</text>
  <text x="506" y="246" font-size="7" fill="#777">Terima kasih</text>
  <!-- Input bar -->
  <rect x="496" y="496" width="148" height="26" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="506" y="513" font-size="8" fill="#999">Ketik pesan...</text>
  <rect x="652" y="496" width="34" height="26" rx="6" fill="#333"/>
  <text x="669" y="513" text-anchor="middle" font-size="9" fill="#fff">▶</text>

  <!-- Annotations -->
  <text x="30" y="548" font-size="9" fill="#999" font-style="italic">Desktop: floating panel 400px. Mobile: fullscreen (inset-0). Bubble hidden saat chat terbuka di mobile.</text>
  <!-- Arrow between views -->
  <line x1="410" y1="300" x2="460" y2="300" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="435" y="290" text-anchor="middle" font-size="8" fill="#999">responsive</text>
</svg>

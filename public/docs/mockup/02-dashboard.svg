<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="system-ui,sans-serif">
  <rect width="800" height="500" fill="#fff" stroke="#e5e7eb"/>
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Wireframe: Dashboard</text>
  <!-- Navbar -->
  <rect x="0" y="45" width="800" height="40" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="16" y="55" width="24" height="20" rx="4" fill="#d1d5db"/>
  <text x="48" y="70" font-size="12" font-weight="600" fill="#374151">IT Helpdesk</text>
  <circle cx="760" cy="65" r="12" fill="#e5e7eb"/>
  <!-- Welcome -->
  <text x="30" y="115" font-size="18" font-weight="700" fill="#111">Selamat Datang, [Nama]</text>
  <text x="30" y="135" font-size="11" fill="#9ca3af">Kelola tiket dan pantau aktivitas helpdesk Anda di sini.</text>
  <!-- Cards Grid -->
  <rect x="30" y="155" width="230" height="130" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="46" y="171" width="36" height="36" rx="8" fill="#e5e7eb"/>
  <text x="46" y="228" font-size="14" font-weight="600" fill="#374151">Tiket</text>
  <text x="46" y="244" font-size="10" fill="#9ca3af">Buat dan kelola tiket IT support</text>
  <rect x="280" y="155" width="230" height="130" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="296" y="171" width="36" height="36" rx="8" fill="#e5e7eb"/>
  <text x="296" y="228" font-size="14" font-weight="600" fill="#374151">Leaderboard</text>
  <text x="296" y="244" font-size="10" fill="#9ca3af">Peringkat performa staff IT</text>
  <rect x="530" y="155" width="230" height="130" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="546" y="171" width="36" height="36" rx="8" fill="#e5e7eb"/>
  <text x="546" y="228" font-size="14" font-weight="600" fill="#374151">Profil Saya</text>
  <text x="546" y="244" font-size="10" fill="#9ca3af">Kelola profil dan ganti password</text>
  <!-- Manager-only cards -->
  <rect x="30" y="305" width="230" height="130" rx="12" fill="#fff" stroke="#d1d5db" stroke-dasharray="6"/>
  <text x="46" y="378" font-size="14" font-weight="600" fill="#9ca3af">Kelola User</text>
  <text x="46" y="394" font-size="10" fill="#d1d5db">MANAGER only</text>
  <rect x="280" y="305" width="230" height="130" rx="12" fill="#fff" stroke="#d1d5db" stroke-dasharray="6"/>
  <text x="296" y="378" font-size="14" font-weight="600" fill="#9ca3af">WhatsApp Gateway</text>
  <text x="296" y="394" font-size="10" fill="#d1d5db">MANAGER only</text>
  <!-- Annotations -->
  <text x="560" y="330" font-size="10" fill="#9ca3af" font-style="italic">Dashed = role-gated cards</text>
</svg>

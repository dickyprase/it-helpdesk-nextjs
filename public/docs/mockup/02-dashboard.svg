<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="system-ui,sans-serif">
  <rect width="800" height="500" fill="#fff" stroke="#ddd"/>
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Wireframe: Dashboard</text>
  <!-- Navbar -->
  <rect x="0" y="45" width="800" height="40" fill="#f5f5f5" stroke="#ddd"/>
  <rect x="16" y="55" width="24" height="20" rx="4" fill="#bbb"/>
  <text x="48" y="70" font-size="12" font-weight="600" fill="#333">IT Helpdesk</text>
  <circle cx="760" cy="65" r="12" fill="#ddd"/>
  <!-- Welcome -->
  <text x="30" y="115" font-size="18" font-weight="700" fill="#111">Selamat Datang, [Nama]</text>
  <text x="30" y="135" font-size="11" fill="#999">Kelola tiket dan pantau aktivitas helpdesk Anda di sini.</text>
  <!-- Cards Grid -->
  <rect x="30" y="155" width="230" height="130" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <rect x="46" y="171" width="36" height="36" rx="8" fill="#ddd"/>
  <text x="46" y="228" font-size="14" font-weight="600" fill="#333">Tiket</text>
  <text x="46" y="244" font-size="10" fill="#999">Buat dan kelola tiket IT support</text>
  <rect x="280" y="155" width="230" height="130" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <rect x="296" y="171" width="36" height="36" rx="8" fill="#ddd"/>
  <text x="296" y="228" font-size="14" font-weight="600" fill="#333">Leaderboard</text>
  <text x="296" y="244" font-size="10" fill="#999">Peringkat performa staff IT</text>
  <rect x="530" y="155" width="230" height="130" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <rect x="546" y="171" width="36" height="36" rx="8" fill="#ddd"/>
  <text x="546" y="228" font-size="14" font-weight="600" fill="#333">Profil Saya</text>
  <text x="546" y="244" font-size="10" fill="#999">Kelola profil dan ganti password</text>
  <!-- Manager-only cards -->
  <rect x="30" y="305" width="230" height="130" rx="12" fill="#fff" stroke="#bbb" stroke-dasharray="6"/>
  <text x="46" y="378" font-size="14" font-weight="600" fill="#999">Kelola User</text>
  <text x="46" y="394" font-size="10" fill="#bbb">MANAGER only</text>
  <rect x="280" y="305" width="230" height="130" rx="12" fill="#fff" stroke="#bbb" stroke-dasharray="6"/>
  <text x="296" y="378" font-size="14" font-weight="600" fill="#999">WhatsApp Gateway</text>
  <text x="296" y="394" font-size="10" fill="#bbb">MANAGER only</text>
  <!-- Annotations -->
  <text x="560" y="330" font-size="10" fill="#999" font-style="italic">Dashed = role-gated cards</text>
</svg>

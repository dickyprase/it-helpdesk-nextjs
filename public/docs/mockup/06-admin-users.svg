  <circle cx="62" cy="290" r="14" fill="#333"/>
  <text x="62" y="294" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">U</text>
  <text x="110" y="288" font-size="11" font-weight="600" fill="#333">User 1</text>

  <rect x="560" y="233" width="46" height="18" rx="9" fill="#fff" stroke="#333"/>
  <text x="583" y="246" text-anchor="middle" font-size="8" font-weight="600" fill="#333">Aktif</text>
  <rect x="660" y="231" width="24" height="22" rx="4" fill="#fff" stroke="#333"/>

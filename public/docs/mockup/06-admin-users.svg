  <rect x="690" y="281" width="24" height="22" rx="4" fill="#fff" stroke="#333"/>
  <text x="702" y="296" text-anchor="middle" font-size="10" fill="#333">✅</text>
  <!-- Annotation -->
  <text x="30" y="430" font-size="9" fill="#bbb" font-style="italic">Manager bisa: tambah user, edit, toggle aktif/nonaktif. Tidak bisa edit diri sendiri.</text>

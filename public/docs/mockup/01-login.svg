<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="system-ui,sans-serif">
  <rect width="800" height="500" fill="#fff" stroke="#ddd"/>
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Wireframe: Halaman Login</text>
  <!-- Background -->
  <rect x="200" y="80" width="400" height="360" rx="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
  <!-- Card -->
  <rect x="240" y="120" width="320" height="280" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="240" y="120" width="320" height="44" rx="12" fill="#eee" stroke="#ddd"/>
  <text x="400" y="147" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Login</text>
  <!-- Email field -->
  <text x="268" y="192" font-size="11" fill="#555">Email address</text>
  <rect x="260" y="198" width="280" height="36" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="272" y="221" font-size="12" fill="#999">name@example.com</text>
  <!-- Password field -->
  <text x="268" y="256" font-size="11" fill="#555">Password</text>
  <rect x="260" y="262" width="280" height="36" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="272" y="285" font-size="12" fill="#999">••••••••</text>
  <!-- Button -->
  <rect x="330" y="320" width="140" height="40" rx="8" fill="#333"/>
  <text x="400" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Login</text>
  <!-- Annotation -->
  <line x1="560" y1="210" x2="620" y2="210" stroke="#999" stroke-dasharray="4"/>
  <text x="625" y="214" font-size="10" fill="#999">Input email</text>
  <line x1="560" y1="275" x2="620" y2="275" stroke="#999" stroke-dasharray="4"/>
  <text x="625" y="279" font-size="10" fill="#999">Input password</text>
  <line x1="470" y1="340" x2="620" y2="340" stroke="#999" stroke-dasharray="4"/>
  <text x="625" y="344" font-size="10" fill="#999">Submit → redirect by role</text>
</svg>
